name: CI

on:
  push:
  pull_request:

jobs:
  build-test-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - name: Build library
        run: alr -n build
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests
      - name: Showcase (write, crash, recover)
        run: |
          cd showcase
          alr -n build
          alr -n run
      - name: File device (unit tests, multi-process smoke)
        run: |
          cd devices/file/smoke
          alr -n build
          ./bin/file_device_tests
          ./run_smoke.sh
      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P legder.gpr --mode=flow --checks-as-errors=on
